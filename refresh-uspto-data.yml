name: Refresh USPTO trademark index

# Runs on a schedule (free on GitHub for public repos - no Render cron
# needed, which would cost money on Render's free tier). Downloads the
# latest USPTO daily bulk data, updates uspto_marks.db, and commits the
# updated file back to the repo. Render auto-redeploys on every push to
# main, so the live MarkScout app picks up the refreshed data automatically
# on the next deploy.

on:
  schedule:
    # Runs weekly, Monday 03:00 UTC. Adjust the cron expression if you
    # want it more/less frequent - daily bulk files are fairly small, so
    # daily refresh is fine too if you want fresher data.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run incremental ingest
        env:
          USPTO_AUTH_HEADER: ${{ secrets.USPTO_AUTH_HEADER }}
        run: |
          if [ -n "$USPTO_AUTH_HEADER" ]; then
            python ingest_uspto.py --mode incremental --auth-header "$USPTO_AUTH_HEADER"
          else
            python ingest_uspto.py --mode incremental
          fi

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uspto_marks.db
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-refresh USPTO index"
          git push
